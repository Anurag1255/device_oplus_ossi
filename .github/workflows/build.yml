name: Build OrangeFox Recovery (ossi)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4

    - name: Free Up Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo apt-get clean
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          g++-multilib gcc-multilib lib32ncurses5-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-utils xsltproc zip unzip wget \
          bc bison build-essential ccache curl flex git gnupg gperf \
          imagemagick liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
          libssl-dev libxml2 lzop pngcrush rsync schedtool squashfs-tools \
          python3 python-is-python3

    - name: Install Latest repo Tool
      run: |
        mkdir -p ~/.local/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
        chmod a+x ~/.local/bin/repo
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global color.ui false

    - name: Initialize TWRP 12.1 Manifest
      run: |
        mkdir -p ~/fox_12.1
        cd ~/fox_12.1
        repo init \
          -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp \
          -b twrp-12.1 \
          --depth=1 \
          --no-clone-bundle \
          --no-tags

    - name: Sync TWRP Source
      run: |
        cd ~/fox_12.1
        repo sync -c -j$(nproc --all) \
          --force-sync \
          --no-clone-bundle \
          --no-tags \
          --optimized-fetch \
          --prune

    - name: Download OrangeFox vendor/fox from GitHub Mirror
      run: |
        wget -q "https://codeload.github.com/OrangeFox-mirror/vendor-recovery/zip/refs/heads/fox_12.1" -O /tmp/fox_vendor.zip
        unzip -q /tmp/fox_vendor.zip -d /tmp/
        mkdir -p ~/fox_12.1/vendor/fox
        cp -r /tmp/vendor-recovery-fox_12.1/* ~/fox_12.1/vendor/fox/
        rm -rf /tmp/fox_vendor.zip /tmp/vendor-recovery-fox_12.1
        echo "vendor/fox ready."

    - name: Download OrangeFox bootable/recovery from GitHub Mirror
      run: |
        rm -rf ~/fox_12.1/bootable/recovery
        wget -q "https://codeload.github.com/OrangeFox-mirror/bootable-recovery/zip/refs/heads/fox_12.1" -O /tmp/fox_recovery.zip
        unzip -q /tmp/fox_recovery.zip -d /tmp/
        mkdir -p ~/fox_12.1/bootable/recovery
        cp -r /tmp/bootable-recovery-fox_12.1/* ~/fox_12.1/bootable/recovery/
        rm -rf /tmp/fox_recovery.zip /tmp/bootable-recovery-fox_12.1
        echo "bootable/recovery ready."

    - name: Setup Device Tree
      run: |
        mkdir -p ~/fox_12.1/device/oplus/ossi
        cp -r $GITHUB_WORKSPACE/* ~/fox_12.1/device/oplus/ossi/

    - name: Build OrangeFox Recovery
      run: |
        cd ~/fox_12.1
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE="Unofficial"
        export LC_ALL="C"
        source build/envsetup.sh
        lunch fox_ossi-eng
        mka recoveryimage -j$(nproc --all) || mka vendorbootimage -j$(nproc --all)

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox_Recovery_ossi
        path: |
          ~/fox_12.1/out/target/product/ossi/OrangeFox*.zip
          ~/fox_12.1/out/target/product/ossi/recovery.img
          ~/fox_12.1/out/target/product/ossi/vendor_boot.img

name: Build OrangeFox Recovery (ossi)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4

    - name: Clean up Runner Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        echo "Disk space after cleanup:"
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          g++-multilib gcc-multilib lib32ncurses5-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev \
          bc bison build-essential ccache curl flex git gnupg gperf \
          imagemagick liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
          libssl-dev libxml2 lzop pngcrush rsync schedtool squashfs-tools \
          python3 python-is-python3 repo

    - name: Initialize OrangeFox Manifest
      run: |
        mkdir -p ~/fox_12.1
        cd ~/fox_12.1
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_12.1 --depth=1

    - name: Sync Recovery Source Code
      run: |
        cd ~/fox_12.1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Setup Device Tree
      run: |
        mkdir -p ~/fox_12.1/device/oplus/ossi
        cp -r $GITHUB_WORKSPACE/* ~/fox_12.1/device/oplus/ossi/

    - name: Build OrangeFox Recovery
      run: |
        cd ~/fox_12.1
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE="Unofficial"
        export LC_ALL="C"
        source build/envsetup.sh
        lunch fox_ossi-eng
        mka recoveryimage -j$(nproc --all) || mka vendorbootimage -j$(nproc --all)

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox_Recovery_ossi
        path: |
          ~/fox_12.1/out/target/product/ossi/OrangeFox*.zip
          ~/fox_12.1/out/target/product/ossi/recovery.img
          ~/fox_12.1/out/target/product/ossi/vendor_boot.img
